# HAKS 2026: the hackathon this tool was born from.
# Brief summarised from the public starter repo (Apache-2.0):
#   https://github.com/probabl-ai/wing-corrosion  (README.md, problem.md)
# Everything in this file is sent to the Kimi API with every run: public facts only.
id: haks-2026
name: "HAKS 2026: Airbus wing corrosion (IBM × Airbus)"
event: "HAKS 2026, Télécom Paris (Palaiseau), 11 June 2026. 150 students in teams of 5. Airbus problem, IBM sponsor. Kaggle leaderboard + pitch to the jury."
brief: |
  Airbus aircraft corrode faster than expected, and corrosivity varies by a factor of about 60
  between airports. Build a "digital twin" of wing degradation: for every aircraft and every month
  of environment_test.csv (142 aircraft delivered in 2014), predict corrosion_risk, the probability
  (0 to 1) that corrosion would be found if the aircraft were inspected that month.

  Data: environment_training.csv (758 aircraft delivered 2015-2024, one row per aircraft-month,
  ~30 variables: METAR weather, Copernicus aerosols such as sea salt and dust, gaseous pollutants,
  monthly parking minutes), corrosions_training.csv (date of first observed corrosion per training
  aircraft), environment_test.csv (same features, no labels).

  Target convention set by Airbus: the month of the corrosion observation = 1, the month exactly
  24 months earlier = 0 (corrosion is non-linear and develops fast).
  Submission: id (aircraft_id_year_month), corrosion_risk for every test row.
  Metric: Brier score on those reference points (lower is better; a constant 0.5 scores 0.25).
  Public leaderboard on half the points, private leaderboard on the other half decides the ranking.

  The pitch matters too: the Airbus presenter wants to learn something new about what drives
  corrosion, explained clearly, not only a leaderboard score.
required_stack:
  - "IBM tooling provided by the sponsor (IBM Bob or IBM watsonx), used in building or running the solution"
criteria:
  - name: "Sound validation"
    weight: 25
    rubric: "Target built with the Airbus convention (observation month = 1, 24 months earlier = 0). Validation split by aircraft (e.g. GroupKFold on aircraft_id), not by row, so the same aircraft is never in train and validation. No test-set information used in training. Reported scores come from that validation, not from training data."
  - name: "Calibrated probabilities"
    weight: 20
    rubric: "Outputs probabilities in [0, 1] for every test row in the required format. Uses predict_proba or equivalent, and calibration (isotonic/Platt, CalibratedClassifierCV) or a clear argument for why the model is already calibrated. Avoids confident 0/1 outputs, which the Brier score punishes."
  - name: "Insight about corrosion"
    weight: 25
    rubric: "Does the team learn something about what drives corrosion (sea salt, humidity, parking time, cumulative exposure, airports), backed by an analysis in the code (feature importance, ablation, plots) rather than asserted in the README?"
  - name: "Use of the IBM stack"
    weight: 10
    rubric: "Is the sponsor's IBM tooling genuinely part of how the solution was built or runs, rather than only mentioned?"
  - name: "Reproducibility"
    weight: 20
    rubric: "Can a juror regenerate the submission end to end from the repo: clear steps, pinned dependencies, no manual notebook surgery, the submission file produced by code."
notes: "The Kaggle score alone can be gamed by overfitting the public leaderboard. Weigh validation quality and genuine insight above a claimed score."
sources:
  - "https://github.com/probabl-ai/wing-corrosion"
  - "https://somo.social/e/haks-2026-hackathon-airbus-x-611"
